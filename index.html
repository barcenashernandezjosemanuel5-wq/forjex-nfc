<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Forjex | Tarjeta digital</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      color: #111;
      padding: 20px;
    }

    .card {
      max-width: 430px;
      margin: 30px auto;
      background: white;
      border-radius: 25px;
      padding: 30px 22px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0,0,0,0.12);
    }

    .foto {
      width: 125px;
      height: 125px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #111;
      margin-bottom: 15px;
    }

    .logo {
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 5px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 5px 0;
      font-size: 30px;
    }

    .puesto {
      color: #666;
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .boton {
      display: block;
      width: 100%;
      padding: 15px;
      margin: 11px 0;
      border-radius: 13px;
      background: #111;
      color: white;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
    }

    .boton:hover {
      opacity: 0.85;
    }

    .forjex {
      margin-top: 25px;
      color: #999;
      font-size: 12px;
      letter-spacing: 2px;
    }

    .error {
      color: #b00020;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="card" id="app">
    <div class="logo">FORJEX</div>
    <p>Cargando tarjeta digital...</p>
  </div>

  <script>

    const API =
      "https://script.google.com/macros/s/AKfycbzzWftqeNnkmhsSyy1pXB8_5xGX_d_g3ZO9jgQ5u1hs_oDhB5Zx9tBPMBgWFPLKdFUJpA/exec";

    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    const app = document.getElementById("app");

    if (!id) {

      app.innerHTML = `
        <div class="logo">FORJEX</div>
        <h1>Forjex NFC</h1>
        <p class="error">No se proporcionó un ID.</p>
      `;

    } else {

      fetch(API + "?id=" + encodeURIComponent(id))

        .then(response => response.json())

        .then(data => {

          if (data.error) {
            throw new Error(data.error);
          }

          app.innerHTML = `

            ${data.foto
              ? `<img class="foto" src="${data.foto}" alt="Foto">`
              : ""
            }

            <div class="logo">FORJEX</div>

            <h1>${data.nombre}</h1>

            <div class="puesto">
              ${data.puesto || ""}
              ${data.empresa ? `<br>${data.empresa}` : ""}
            </div>

            ${data.telefono
              ? `<a class="boton" href="tel:${data.telefono}">📞 Llamar</a>`
              : ""
            }

            ${data.whatsapp
              ? `<a class="boton" href="https://wa.me/${data.whatsapp}">💬 WhatsApp</a>`
              : ""
            }

            ${data.correo
              ? `<a class="boton" href="mailto:${data.correo}">✉️ Correo</a>`
              : ""
            }

            ${data.instagram
              ? `<a class="boton" href="${data.instagram}" target="_blank">📸 Instagram</a>`
              : ""
            }

            ${data.facebook
              ? `<a class="boton" href="${data.facebook}" target="_blank">📘 Facebook</a>`
              : ""
            }

            ${data.linkedin
              ? `<a class="boton" href="${data.linkedin}" target="_blank">💼 LinkedIn</a>`
              : ""
            }

            <div class="forjex">
              TARJETA DIGITAL NFC
            </div>
          `;
        })

        .catch(error => {

          app.innerHTML = `
            <div class="logo">FORJEX</div>
            <h1>Ups...</h1>
            <p class="error">
              No pudimos cargar esta tarjeta.
            </p>
          `;

          console.error(error);
        });

    }

  </script>

</body>
</html>
